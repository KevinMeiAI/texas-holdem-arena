services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena-local}
      POSTGRES_DB: ${POSTGRES_DB:-arena}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-arena}"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - arena_postgres:/var/lib/postgresql/data

  app:
    build: .
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      DATABASE_URL: postgres://${POSTGRES_USER:-arena}:${POSTGRES_PASSWORD:-arena-local}@db:5432/${POSTGRES_DB:-arena}
      ARENA_MASTER_KEY: ${ARENA_MASTER_KEY:-}
      ARENA_ADMIN_EMAIL: ${ARENA_ADMIN_EMAIL:-admin@localhost}
      ARENA_ADMIN_PASSWORD: ${ARENA_ADMIN_PASSWORD:-change-me-now}
      ARENA_COOKIE_SECURE: ${ARENA_COOKIE_SECURE:-false}
      ARENA_PUBLIC_ORIGIN: ${ARENA_PUBLIC_ORIGIN:-http://127.0.0.1:4100}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4100:4100"
    restart: unless-stopped

volumes:
  arena_postgres:
